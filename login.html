<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link rel="stylesheet" href="style.css">
  <script>
    function toggleForm() {
      const studentFields = document.getElementById('studentFields');
      const facultyFields = document.getElementById('facultyFields');
      const isStudent = document.getElementById('studentRadio').checked;

      if (isStudent) {
        studentFields.style.display = 'block';
        facultyFields.style.display = 'none';
      } else {
        studentFields.style.display = 'none';
        facultyFields.style.display = 'block';
      }
    }
  </script>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1>Welcome Back!</h1>
      <p>Choose your role to continue</p>
      <form>
        <div class="radio-group">
          <label>
            <input type="radio" name="userType" id="studentRadio" value="student" onclick="toggleForm()" checked>
            <span>Student</span>
          </label>
          <label>
            <input type="radio" name="userType" id="facultyRadio" value="faculty" onclick="toggleForm()">
            <span>Faculty</span>
          </label>
        </div>

        <!-- Student Fields -->
        <div id="studentFields" class="form-fields">
          <label for="studentEmail">Student Email:</label>
          <input type="email" id="studentEmail" name="email" placeholder="Enter your email">
          <label for="studentPassword">Password:</label>
          <input type="password" id="studentPassword" name="password" placeholder="Enter your password">
        </div>

        <!-- Faculty Fields -->
        <div id="facultyFields" class="form-fields" style="display: none;">
          <label for="facultyEmail">Faculty Email:</label>
          <input type="email" id="facultyEmail" name="email" placeholder="Enter your email">
          <label for="facultyPassword">Password:</label>
          <input type="password" id="facultyPassword" name="password" placeholder="Enter your password">
        </div>

      <!--  <button type="submit" class="login-button">Login</button>  -->
        <a href="index.html" class="login-button">Login</a>
      </form>
    </div>
  </div>
</body>
</html>
